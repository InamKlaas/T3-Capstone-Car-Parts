spring.application.name=CarPartMarket

spring.datasource.url=jdbc:mysql://localhost:3306/carpartmarket_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

server.port=8081

app.admin.email=admin@carpartmarket.co.za
app.admin.password=${ADMIN_PASSWORD:NewPass123}
jwt.secret=Y2FycGFydG1hcmtldC1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1tZS0yMDI2IQ==
jwt.expiration-ms=86400000


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=automarket.noreply@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true